<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevCompass: descubre, guarda y sigue repositorios de GitHub." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DevCompass</title>
    <script>
      // Aplica el tema y el idioma antes de pintar para evitar parpadeos.
      ;(function () {
        let theme = null
        let language = null
        try {
          theme = localStorage.getItem('devcompass-theme')
          language = localStorage.getItem('devcompass-language')
        } catch (error) {
          theme = null
        }
        if (language === 'es' || language === 'en') {
          document.documentElement.lang = language
        } else if (!navigator.language.toLowerCase().startsWith('es')) {
          document.documentElement.lang = 'en'
        }
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
